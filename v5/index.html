<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>watanabe-toshado-app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="css/runtime.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div id="topbar">
    <span class="tb-logo">b</span>
    <span class="tb-appname">watanabe-toshado-app</span>
    <select id="tb-page" title="ページ切替"></select>
    <button class="tb-btn active" id="tb-design">Design</button>
    <button class="tb-btn" id="tb-workflow">⚡ Workflow</button>
    <button class="tb-btn" id="tb-inspect" title="ホバーインスペクタON/OFF">🔍 Inspect</button>
    <div class="tb-right">
      <span class="tb-hint">要素にホバー→インスペクタ / ログインは任意のメール+パスワードでOK</span>
      <span class="tb-user" id="tb-user"></span>
      <button class="tb-btn" id="tb-reset" title="ダミーデータへ初期化">DBリセット</button>
    </div>
  </div>
  <div id="app-mount"></div>
  <div id="inspector-dock"></div>
  <div id="wf-mount" style="display:none"></div>

  <script src="js/data.js"></script>
  <script src="js/extra_pages.js"></script>
  <script src="js/core.js"></script>
  <script src="js/db.js"></script>
  <script src="js/expr.js"></script>
  <script src="js/render.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/inspector.js"></script>
  <script src="js/workflow.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
