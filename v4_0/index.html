// ================== 画面: 帳簿 ==================
const ledgerState = { month: '2026-07' };
function ledgerRows(month) {
  return ORDERS
    .filter(o => o.delivered && o.delivered.startsWith(month))
    .map(o => {
      const c = CUSTOMERS[o.cust];
      const inv = INVOICES.find(v => v.orders.includes(o.no));
      const rec = RECEIPTS.find(r => r.order === o.no);
      let payst;
      if (c.pay === '現金') payst = rec ? '現金回収済' : '未回収';
      else if (inv && inv.status === '入金済') payst = '入金済';
      else if (inv && (inv.status === '発行済' || inv.status === '入金待ち')) payst = '入金待ち';
      else payst = '未発行';
      return { o, c, payst };
    })
    .sort((a,b) => a.o.delivered.localeCompare(b.o.delivered));
}
function renderLedger() {
  const rows = ledgerRows(ledgerState.month);
  const sumAll  = rows.reduce((s,r) => s + orderTotal(r.o), 0);
  const sumCash = rows.filter(r => r.c.pay === '現金').reduce((s,r) => s + orderTotal(r.o), 0);
  const sumKake = sumAll - sumCash;

      <div class="text-2xl font-black ${color}">${val}</div>
      <div class="text-[11px] text-ink-300">${sub}</div>
    </div>`;

  return `

    <div class="flex items-center gap-2 text-sm">

function createMonthlyInvoice() {
  const cust = $('#new-inv-cust').value;
  const month = $('#new-inv-month').value;
  const targets = ORDERS.filter(o => o.cust === cust && o.delivered && o.delivered.startsWith(month) && !INVOICES.some(v => v.orders.includes(o.no)));
  if (targets.length === 0) { toast('対象月に未請求の納品がありません'); return; }
  const id = 'INV-NEW-' + String(INVOICES.length + 1).padStart(3, '0');
  INVOICES.push({ id, type:'月締め', cust, month, orders: targets.map(t => t.no), issued: null, due: month === '2026-07' ? '2026-08-31' : '2026-09-30', status:'未発行', paidDate: null });
  invoiceState.selected = id;
  invoiceState.showNew = false;
  toast(`${custName(cust)} の${month.replace('-','年')}月分請求書を作成（${targets.length}件をまとめました）`);
  render();
}

const timelineState = { selected: '260706-001' };
function orderEvents(o) {
  const ev = [];
  const c = CUSTOMERS[o.cust];
  ev.push({ d: o.date, label: '受注', desc: `${c.name}より受注（${o.title}）`, color: 'bg-red-500' });
  if (o.status !== '受注') ev.push({ d: o.date, label: '製作開始', desc: '製版・印刷工程へ', color: 'bg-amber-500' });
  if (o.delivered) {
    ev.push({ d: o.delivered, label: '納品', desc: '納品完了・売上帳へ自動記帳', color: 'bg-ok' });
    const dn = DELIVERY_NOTES.find(d => d.order === o.no);
    if (dn && dn.status === '発行済') ev.push({ d: dn.date, label: '納品書発行', desc: `納品書 ${dn.id}`, color: 'bg-brand' });
  }
  const inv = INVOICES.find(v => v.orders.includes(o.no));
  if (inv && inv.issued) ev.push({ d: inv.issued, label: '請求書発行', desc: `${inv.id}（${inv.type}${inv.month ? '・' + inv.month.replace('-','年') + '月分' : ''}）`, color: 'bg-purple-500' });
  if (inv && inv.paidDate) ev.push({ d: inv.paidDate, label: '入金', desc: `${yen(invAmount(inv))} 入金確認・消込`, color: 'bg-ok-dark' });
  const rec = RECEIPTS.find(r => r.order === o.no || (inv && r.invoice === inv.id));
  if (rec) ev.push({ d: rec.date, label: '領収書発行', desc: `領収書 ${rec.id}（${rec.method}）`, color: 'bg-blue-500' });
  return ev.sort((a,b) => a.d.localeCompare(b.d));
}
function stageDates(o) {
  const inv = INVOICES.find(v => v.orders.includes(o.no));
  const rec = RECEIPTS.find(r => r.order === o.no || (inv && r.invoice === inv.id));
  const cash = CUSTOMERS[o.cust].pay === '現金';
  return {
    受注: o.date,
    納品: o.delivered,
    請求: inv ? inv.issued : (cash ? (o.delivered ? '現金' : null) : null),
    入金: inv?.paidDate || (cash && rec ? rec.date : null),
    領収: rec ? rec.date : null,
  };
}
function renderTimeline() {
  const sel = orderOf(timelineState.selected) || ORDERS[0];
  const evs = orderEvents(sel);
  const cell = (v, danger) => v === null || v === undefined
    ? `<td class="px-2 py-2 text-center ${danger ? 'bg-red-50 text-red-500 font-bold' : 'text-ink-300'}">${danger ? '未' : '—'}</td>`
    : `<td class="px-2 py-2 text-center">${v === '現金' ? '<span class="text-xs font-bold text-ok-dark">現金</span>' : jd(v)}</td>`;

  return `
  <h2 class="text-xl font-black mb-1">時系列記録表</h2>
  <div class="text-xs text-ink-500 mb-4">全受注の「受注 → 納品 → 請求 → 入金 → 領収」を一覧で確認。<span class="text-red-500 font-bold">赤の「未」</span>＝止まっている工程。行クリックで詳細タイムライン。</div>

  <div class="grid lg:grid-cols-[1fr_400px] gap-5">
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-ink-900 text-white text-xs">
          <tr>
            <th class="px-2 py-2 text-left">受注No / 顧客 / 品名</th>
            <th class="px-2 py-2">受注</th><th class="px-2 py-2">納品</th>
            <th class="px-2 py-2">請求</th><th class="px-2 py-2">入金</th><th class="px-2 py-2">領収書</th>
          </tr>
        </thead>
        <tbody>
          ${ORDERS.slice().sort((a,b) => b.date.localeCompare(a.date)).map(o => {
            const s = stageDates(o);
            const cash = CUSTOMERS[o.cust].pay === '現金';
            const delivered = !!o.delivered;
            return `
            <tr class="border-b cursor-pointer hover:bg-brand-light/40 ${o.no===sel.no ? 'bg-brand-light' : ''}" onclick="timelineState.selected='${o.no}';render()">
              <td class="px-2 py-2">
                <div class="font-mono text-[10px] text-ink-500">${o.no} ${stBadge(o.status)}</div>
                <div class="font-bold text-xs">${custName(o.cust)}</div>
                <div class="text-[11px] text-ink-500">${o.title}</div>
              </td>
              ${cell(s.受注)}
              ${cell(s.納品, false)}
              ${cell(s.請求, delivered && !s.請求)}
              ${cell(s.入金, delivered && !!s.請求 && s.請求 !== '現金' && !s.入金)}
              ${cell(s.領収, false)}
            </tr>`; }).join('')}
        </tbody>
      </table>
    </div>

    <div class="bg-white rounded-lg shadow p-5 h-fit sticky top-28">
      <div class="font-black mb-1">${sel.title}</div>
      <div class="text-xs text-ink-500 mb-4">${custName(sel.cust)}｜${sel.no}｜${yen(orderTotal(sel))}（税込）</div>
      <div class="relative pl-2">
        <div class="tl-line"></div>
        ${evs.map(e => `
        <div class="flex gap-3 mb-4 relative">
          <div class="tl-dot ${e.color}"></div>
          <div>
            <div class="text-xs text-ink-500">${jd(e.d)}</div>
            <div class="font-bold text-sm">${e.label}</div>
            <div class="text-xs text-ink-500">${e.desc}</div>
          </div>
        </div>`).join('')}
        ${(() => {
          const s = stageDates(sel);
          if (sel.delivered && !s.請求) return `<div class="flex gap-3 relative"><div class="tl-dot bg-red-500 animate-pulse"></div><div><div class="font-bold text-sm text-red-600">⚠ 請求書が未発行です</div><div class="text-xs text-ink-500">請求書タブから発行できます</div></div></div>`;
          if (s.請求 && s.請求 !== '現金' && !s.入金) return `<div class="flex gap-3 relative"><div class="tl-dot bg-amber-500 animate-pulse"></div><div><div class="font-bold text-sm text-amber-600">入金待ち</div><div class="text-xs text-ink-500">期限が近づくと通知（案）</div></div></div>`;
          if (!sel.delivered) return `<div class="flex gap-3 relative"><div class="tl-dot bg-gray-300"></div><div><div class="font-bold text-sm text-ink-500">製作中…</div></div></div>`;
          return `<div class="flex gap-3 relative"><div class="tl-dot bg-ok"></div><div><div class="font-bold text-sm text-ok-dark">✓ この案件は完結しています</div></div></div>`;
        })()}
      </div>
    </div>
  </div>`;
}

// ================== ルーター ==================
let currentTab = 'flow';
const SCREENS = { flow: renderFlow, ledger: renderLedger, delivery: renderDelivery, invoice: renderInvoice, receipt: renderReceipt, timeline: renderTimeline };

function render() {
  $('#main').innerHTML = SCREENS[currentTab]();
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
  const lm = $('#ledger-month');
  if (lm) lm.onchange = () => { ledgerState.month = lm.value; render(); };
}
$$('.tab-btn').forEach(b => b.onclick = () => { currentTab = b.dataset.tab; render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
